name: Check pull request
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

env:
  DEBUG_DYN_ACTION_ENABLED: 'true'

jobs:
  ok_tests:
    name: "Run ok tests"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - &checkout_step
        name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          submodules: "recursive"
          ref: ${{ github.event.pull_request.head.sha }}
      - &setup_go
        name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.26.x'
      - name: Run tests
        run: make makefile-go/test/ok/all

  fail_gitignore:
    name: "Run fail go/check/gitignore test"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ok_tests]

    steps:
      - *checkout_step
      - name: Run test
        run: make makefile-go/test/fail/gitignore

  fail_lint:
    name: "Run fail go/lint test"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ok_tests]

    steps:
      - *checkout_step
      - *setup_go
      - name: Run test
        run: make makefile-go/test/fail/lint

  fail_tidy:
    name: "Run fail go/check/no-tidy test"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ok_tests]

    steps:
      - *checkout_step
      - *setup_go
      - name: Run test
        run: make makefile-go/test/fail/no-tidy

  fail_tests:
    name: "Run fail go/test test"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ok_tests]

    steps:
      - *checkout_step
      - *setup_go
      - name: Run test
        run: make makefile-go/test/fail/run-tests

  action_tests_ok:
    name: "Test action test"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - *checkout_step
      - name: Run action
        uses: name212/action-dynamic-uses@dc77a3349fecbd50c85ee651868ac03444af877a # v3
        with:
          uses: 'dir:makefile-go/.github/actions/test'
          with: |
            go_version: "1.26.x"
            checkout: ""
            run_race_tests: "with_tests"
            parallel_tests: "false"
            test_tags: "test_tag_first,test_tag_second"
            envs: |
              # Pass event with comment
              BLAH_ENV=passed

  action_tests_logs:
    name: "Check log for test job run action"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [action_tests_ok]

    steps:
      - name: Check action logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          if ! job_id=$(gh run --repo "$GITHUB_REPOSITORY" view --json jobs "$GITHUB_RUN_ID" | yq '.jobs[] | select(.name == "Test action test") | .databaseId'); then
            echo "Cannot get job id"
            exit 1
          fi

          echo "Got job id: $job_id"

          if ! gh run --repo "$GITHUB_REPOSITORY" view --log --job "$job_id" > ./.action_job_log; then
            echo "Cannot get logs for job"
            exit 1
          fi

          to_check=(
            "BLAH_ENV=passed"
            "Tags test_tag_first and test_tag_second were set"
          )
          
          failed=""

          for _ck in "${to_check[@]}"; do
            if ! grep -q "$_ck" ./.action_job_log; then
              failed="true"
              echo "Pattern '$_ck' not found in action log"
            fi
          done

          if [ -n "$failed" ]; then
            exit 1
          fi
      - name: Check action logs
        if: always()
        run: rm -f "./.action_job_log"
