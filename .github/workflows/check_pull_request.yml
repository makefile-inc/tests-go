name: Check pull request
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

env:
  DEBUG_DYN_ACTION_ENABLED: 'true'

jobs:
  ok_tests:
    name: "Run ok tests"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - &checkout_step
        name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          submodules: "recursive"
          ref: ${{ github.event.pull_request.head.sha }}
      - &setup_go
        name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.26.x'
      - name: Run tests
        run: make makefile-go/test/ok/all

  fail_gitignore:
    name: "Run fail go/check/gitignore test"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ok_tests]

    steps:
      - *checkout_step
      - name: Run test
        run: make makefile-go/test/fail/gitignore

  fail_lint:
    name: "Run fail go/lint test"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ok_tests]

    steps:
      - *checkout_step
      - *setup_go
      - name: Run test
        run: make makefile-go/test/fail/lint

  fail_tidy:
    name: "Run fail go/check/no-tidy test"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ok_tests]

    steps:
      - *checkout_step
      - *setup_go
      - name: Run test
        run: make makefile-go/test/fail/no-tidy

  fail_tests:
    name: "Run fail go/test test"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ok_tests]

    steps:
      - *checkout_step
      - *setup_go
      - name: Run test
        run: make makefile-go/test/fail/run-tests

  action_tests_ok:
    name: "Test action test ok"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - *checkout_step
    - name: Run action
      uses: name212/action-dynamic-uses@dc77a3349fecbd50c85ee651868ac03444af877a # v3
      with:
        uses: 'dir:makefile-go/.github/actions/test'
        with: |
          run_race_tests: "with_tests"
          tests_parallelism: "false"
          tests_tags: "test_tag_first,test_tag_second"
          tests_envs: |
            # Pass event with comment
            BLAH_ENV=passed

    # - name: Run tests
    #   uses: makefile-inc/go/.github/actions/test@c1dc384e6fa2eb1e15a418d9c148d99fc8c05bbd
    #   with:
    #     go_version: "1.26.x"
    #     checkout: ${{ github.event.pull_request.head.sha }}
    #     run_race_tests: "with_tests"
    #     tests_parallelism: "false"
    #     tests_tags: "test_tag_first,test_tag_second"
    #     tests_envs: |
    #       # Pass event with comment
    #       BLAH_ENV=passed

  action_tests_fail:
    name: "Test action test fail parallel"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - *checkout_step
    - name: Run action
      continue-on-error: true
      uses: name212/action-dynamic-uses@dc77a3349fecbd50c85ee651868ac03444af877a # v3
      with:
        uses: 'dir:makefile-go/.github/actions/test'
        with: |
          parallel: "all"
          run_race_tests: "with_tests"
          tests_parallelism: "false"
          tests_tags: "test_tag_first,test_tag_second"
          tests_envs: |
            # Pass event with comment
            BLAH_ENV=passed
            # Fail tests
            DO_FAIL_TEST=true

  action_tests_seq:
    name: "Test action test run sequentially"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - *checkout_step
    - name: Run action
      uses: name212/action-dynamic-uses@dc77a3349fecbd50c85ee651868ac03444af877a # v3
      with:
        uses: 'dir:makefile-go/.github/actions/test'
        with: |
          parallel: ""
          run_race_tests: "with_tests"
          tests_parallelism: "false"
          tests_tags: "test_tag_first,test_tag_second"
          tests_envs: |
            # Pass event with comment
            BLAH_ENV=passed

  action_release_test:
    name: "Test action release"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - *checkout_step
    - name: Release name
      id: release_name
      run: |
        echo "tag=v${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
    - name: Release example
      uses: name212/action-dynamic-uses@dc77a3349fecbd50c85ee651868ac03444af877a # v3
      with:
        uses: 'dir:makefile-go/.github/actions/release'
        with: |
          token: ${{ secrets.GITHUB_TOKEN }}
          target_ref: ${{ github.event.pull_request.head.sha }}
          project: "example"
          build_target: "makefile-go/release/example"
          tests_parallelism: "false"
          release_name: ${{ steps.release_name.outputs.tag }}
          release_notes: |
            Test release action on `${{ github.event.pull_request.head.sha }}`

    - name: Release main
      uses: name212/action-dynamic-uses@dc77a3349fecbd50c85ee651868ac03444af877a # v3
      with:
        uses: 'dir:makefile-go/.github/actions/release'
        with: |
          token: ${{ secrets.GITHUB_TOKEN }}
          go_version: ""
          target_ref: ${{ github.event.pull_request.head.sha }}
          project: "main"
          build_target: "makefile-go/release/main"
          release_name: "${{ steps.release_name.outputs.tag }}"
          prepare_artifacts: |
            cp "README.md" "$RELEASE_GO_ARTIFACTS_DIR"
            cp "LICENSE" "$RELEASE_GO_ARTIFACTS_DIR"
          release_notes: |
            Test release action on `${{ github.event.pull_request.head.sha }}`
